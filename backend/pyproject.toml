[project]
name = "portfolio-tracker-backend"
version = "0.1.0"
description = "Cross-broker portfolio tracking API"
requires-python = "~=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pandas",
    "websockets",
    "python-dotenv",
    "alembic",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]